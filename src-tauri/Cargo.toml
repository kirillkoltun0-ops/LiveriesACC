[package]
name = "dobeg-launcher"
version = "1.0.0"
description = "DOBEG LEAGUE — ACC livery launcher"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dobeg_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures-util = "0.3"
dirs = "5"
base64 = "0.22"
percent-encoding = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
