name = "dobeg-livery-server"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
OWNER = "kirillkoltun0-ops"
REPO = "dobeg-liveries"

# Для wrangler: создайте KV (wrangler kv namespace create LIVERIES) и впишите id.
# Через панель Cloudflare это делается в Settings → Bindings.
# [[kv_namespaces]]
# binding = "LIVERIES"
# id = "…"
# Секрет логинов админов: wrangler secret put ADMINS   (формат "kirill:пароль,ivan:пароль")
